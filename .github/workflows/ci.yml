name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL server binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
      - name: Verify PostgreSQL cluster binaries
        run: |
          set -eu
          for name in initdb pg_ctl pg_basebackup; do
            path="$(find /usr/lib/postgresql -type f -path "*/bin/${name}" | head -n 1)"
            test -n "$path"
            echo "$name: $path"
          done
      - run: pip install -r requirements.txt pytest
      - run: python -m py_compile app/main.py
      - run: pytest -q
